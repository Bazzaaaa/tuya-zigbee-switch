name: Build LW-US-4P (Telink only)

# Builds only the SWITCH_UNSH_LW_US_4P board and skips the Silicon Labs tools,
# which are not needed for Telink devices. Run it on the add-unsh-lw-us-4p branch.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y make python3 python3-venv yq unzip wget bzip2

    - name: Cache Telink Tools
      uses: actions/cache@v4
      with:
        path: telink_tools
        key: telink-tools-v3.7.2.0

    - name: Install Telink SDK and toolchain
      run: make telink/tools/all

    - name: Set up Python environment
      run: make setup_venv

    - name: Build SWITCH_UNSH_LW_US_4P (router)
      run: |
        source .venv/bin/activate
        BOARD=SWITCH_UNSH_LW_US_4P DEVICE_TYPE=router make board/build
        ls -l bin/router/SWITCH_UNSH_LW_US_4P/

    - name: Update Z2M converters
      run: |
        source .venv/bin/activate
        make tools/update_converters

    - name: Commit and push results
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git add bin/* zigbee2mqtt/*
        git diff --cached --quiet || git commit -m "Build LW-US-4P firmware, OTA files and converters"
        source .venv/bin/activate
        make tools/freeze_ota_links
        git add zigbee2mqtt/*
        git diff --cached --quiet || git commit -m "Freeze links in OTA index files"
        git push
